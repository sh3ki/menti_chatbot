<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menti — Profile Settings</title><link rel="stylesheet" href="/static/css/provider_portal.css"><style>.profile-form{max-width:820px}.profile-form .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.profile-form .field{margin-bottom:3px}.profile-form .field.full{grid-column:1/-1}.profile-form label{display:block;margin:0 0 7px;color:#506055;font-size:12px;font-weight:700}.profile-form input,.profile-form select{width:100%;padding:12px 13px;border:1px solid #d4e0d5;border-radius:10px;background:#fff;color:#17221a;font:inherit}.profile-form input[readonly]{background:#f3f6f3;color:#718076}.profile-actions{display:flex;justify-content:flex-end;margin-top:18px}.profile-alert{margin-bottom:20px;padding:12px 14px;border-radius:10px;font-size:13px}.profile-alert.success{background:#eaf7eb;color:#286033;border:1px solid #bfe0c2}.profile-alert.error{background:#fff1f1;color:#a52626;border:1px solid #efcaca}@media(max-width:700px){.profile-form .grid{grid-template-columns:1fr}.profile-form .field.full{grid-column:auto}}</style></head><body>
<header class="provider-header"><div class="provider-brand"><img class="provider-logo" src="/static/menti logo.png" alt="Menti"><span>Menti</span></div><div class="provider-header-right"><span class="provider-badge">{{ provider.role|capitalize }}</span><div class="provider-profile" id="profile"><button class="provider-profile-button" id="profileButton"><span class="provider-avatar">{{ (provider.displayName[:1] if provider.displayName else 'P')|upper }}</span><span class="provider-header-name">{{ provider.displayName or provider.email }}</span><span>⌄</span></button><div class="provider-profile-menu"><a href="/providers/profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile Settings</a><button class="logout" id="logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M21 19V5a2 2 0 0 0-2-2h-6"/></svg>Log out</button></div></div></div></header>
<div class="provider-layout"><aside class="provider-sidebar"><div class="provider-sidebar-label">Main</div><a class="provider-nav" href="/providers/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>Dashboard</span></a><a class="provider-nav" href="/providers/calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Calendar</span></a><a class="provider-nav" href="/providers/video-call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg><span>Counselling Sessions</span></a><div class="provider-sidebar-label">Account</div><a class="provider-nav active" href="/providers/profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile Settings</span></a></aside>
<main class="provider-main"><div class="provider-title-row"><div><h1 class="provider-title">Profile Settings</h1><p class="provider-subtitle">Manage your provider account and professional information.</p></div></div><section class="provider-card profile-form">{% if success %}<div class="profile-alert success">{{ success }}</div>{% endif %}{% if error %}<div class="profile-alert error">{{ error }}</div>{% endif %}<form method="post"><div class="grid"><div class="field"><label for="firstName">First name</label><input id="firstName" name="firstName" value="{{ provider.firstName or '' }}" required></div><div class="field"><label for="middleName">Middle name</label><input id="middleName" name="middleName" value="{{ provider.middleName or '' }}"></div><div class="field"><label for="lastName">Last name</label><input id="lastName" name="lastName" value="{{ provider.lastName or '' }}" required></div><div class="field"><label for="role">Professional role</label><select id="role" name="role" required><option value="psychiatrist"{% if provider.role == 'psychiatrist' %} selected{% endif %}>Psychiatrist</option><option value="psychologist"{% if provider.role == 'psychologist' %} selected{% endif %}>Psychologist</option></select></div><div class="field full"><label for="email">Email address</label><input id="email" value="{{ provider.email or '' }}" readonly></div><div class="field full"><label for="licenseNumber">Professional license number</label><input id="licenseNumber" name="licenseNumber" value="{{ provider.licenseNumber or '' }}" required></div></div><div class="profile-actions"><button class="provider-button" type="submit">Save changes</button></div></form></section></main></div>
<script>const profile=document.getElementById('profile'),button=document.getElementById('profileButton');button.onclick=e=>{e.stopPropagation();profile.classList.toggle('open')};document.addEventListener('click',()=>profile.classList.remove('open'));document.getElementById('logout').onclick=async()=>{await fetch('/providers/logout',{method:'POST'});location='/providers/login'};const providerArrow=document.querySelector('.provider-profile-button > span:last-child');if(providerArrow)providerArrow.outerHTML='<svg class="provider-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';</script></body></html>
