<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menti — Admin Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a3320 0%, #2C5E31 50%, #1a3320 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #0F0F0F;
        }

        .admin-card {
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
            width: 100%;
            max-width: 420px;
            padding: 48px 40px;
            animation: slideUp 0.4s ease-out;
            position: relative;
            overflow: hidden;
        }

        .admin-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #2C5E31, #3A7A40, #4A9B52);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .admin-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #2C5E31, #3A7A40);
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 28px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .admin-badge svg {
            width: 14px;
            height: 14px;
            fill: white;
        }

        .logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-image {
            width: 72px;
            height: 72px;
            margin-bottom: 14px;
            object-fit: contain;
        }

        .logo h1 {
            color: #2C5E31;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: #28282B;
            font-size: 14px;
            font-weight: 400;
            opacity: 0.65;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #0F0F0F;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.2px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: #999;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border: 2px solid #E0E0E0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s ease;
            background: #FAFAFA;
            color: #0F0F0F;
            font-family: inherit;
        }

        .form-group input::placeholder { color: #28282B; opacity: 0.45; }

        .form-group input:focus {
            outline: none;
            border-color: #2C5E31;
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(44, 94, 49, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #2C5E31, #3A7A40);
            color: #FFFFFF;
            font-family: inherit;
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(44, 94, 49, 0.35);
        }

        .btn-login:active { transform: translateY(0); }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-msg {
            background: #FFF2F2;
            border: 1px solid #FFCDD2;
            color: #C62828;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-msg.show { display: flex; }

        .security-note {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #28282B;
            opacity: 0.5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .security-note svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            fill: none;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="admin-card">
        <!-- Top accent bar is via ::before -->

        <div class="admin-badge">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
            </svg>
            Admin Portal
        </div>

        <div class="logo">
            <img src="{{ url_for('static', filename='menti logo.png') }}" alt="Menti Logo" class="logo-image">
            <h1>Menti Admin</h1>
            <p>Authorized personnel only</p>
        </div>

        <div class="error-msg" id="errorMsg">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="errorText">Invalid credentials. Please try again.</span>
        </div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="username" name="username" placeholder="Enter admin username" autocomplete="username" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" name="password" placeholder="Enter admin password" autocomplete="current-password" required>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">Log In to Dashboard</button>
        </form>

        <div class="security-note">
            <svg viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Secured connection &mdash; Admin access only
        </div>
    </div>

    <script>
        const form = document.getElementById('adminLoginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const errorText = document.getElementById('errorText');

        // Allow Enter key on inputs
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') form.dispatchEvent(new Event('submit'));
            });
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('show');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Please enter both username and password.');
                return;
            }

            // Loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span>Authenticating...';

            try {
                const res = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    loginBtn.innerHTML = '✅ Redirecting...';
                    window.location.href = data.redirect || '/admin/dashboard';
                } else {
                    showError(data.error || 'Invalid credentials. Please try again.');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Log In to Dashboard';
                }
            } catch (err) {
                showError('Connection error. Please try again.');
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Log In to Dashboard';
            }
        });

        function showError(msg) {
            errorText.textContent = msg;
            errorMsg.classList.add('show');
        }
    </script>
</body>
</html>
