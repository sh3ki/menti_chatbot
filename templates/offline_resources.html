<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menti - Offline Resources</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #F0F0F0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; color: #0F0F0F; }
        .header { background: #FFF; padding: 16px 24px; border-bottom: 1px solid #E0E0E0; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .sidebar-toggle { display: none; background: none; border: none; padding: 8px; cursor: pointer; color: #2C5E31; }
        .header-logo { width: 36px; height: 36px; object-fit: contain; }
        .header h1 { color: #2C5E31; font-size: 22px; font-weight: 700; }

        .header-right { display: flex; align-items: center; gap: 10px; }
        .incognito-topbar-btn {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: #F3F0FF;
            color: #5B21B6;
            border: 1.5px solid #DDD6FE;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            font-family: inherit;
        }
        .incognito-topbar-btn:hover { background: #EDE9FE; border-color: #C4B5FD; }
        .incognito-topbar-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
        .profile-menu-wrap { position: relative; display: none; }
        .profile-menu-trigger { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 5px; border: 1.5px solid #E0E0E0; border-radius: 22px; background: none; cursor: pointer; }
        .header-avatar { width: 30px; height: 30px; border-radius: 50%; background: #E8F5E9; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #2C5E31; overflow: hidden; }
        .header-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .header-name { font-size: 13px; font-weight: 600; color: #28282B; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .profile-dropdown { display: none; position: absolute; right: 0; top: calc(100% + 8px); background: #FFF; border: 1px solid #E8E8E8; border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,0.12); min-width: 210px; z-index: 300; padding: 4px 0; }
        .profile-menu-wrap.open .profile-dropdown { display: block; }
        .profile-dropdown-item { display: block; padding: 11px 16px; font-size: 13px; font-weight: 500; color: #28282B; text-decoration: none; background: none; border: none; width: 100%; text-align: left; cursor: pointer; font-family: inherit; }
        .profile-dropdown-item.active-page { color: #2C5E31; background: #F0F7F1; font-weight: 600; }
        .profile-dropdown-divider { height: 1px; background: #F0F0F0; margin: 4px 0; }
        .profile-dropdown-logout { color: #C62828; }

        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 280px; background: #FFF; border-right: 1px solid #E0E0E0; display: flex; flex-direction: column; transition: transform 0.3s ease; flex-shrink: 0; }
        .sidebar.hidden { transform: translateX(-100%); position: absolute; height: calc(100% - 70px); z-index: 500; }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #E0E0E0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background: #2C5E31;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .new-chat-btn:hover { background: #234A27; }
        .new-chat-btn svg { width: 18px; height: 18px; }
        .toggle-archived-btn {
            width: 100%;
            padding: 10px 16px;
            background: #F0F0F0;
            color: #28282B;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .toggle-archived-btn:hover { background: #E8E8E8; border-color: #D0D0D0; }
        .toggle-archived-btn svg { width: 16px; height: 16px; }
        .toggle-archived-btn.active { background: #E8F5E9; color: #2C5E31; border-color: #4FA858; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 12px; }
        .sidebar-section-title { font-size: 12px; font-weight: 600; color: #28282B; opacity: 0.5; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .conv-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #28282B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-item:hover { background: #F0F0F0; }
        .empty-state { font-size: 12px; color: #28282B; opacity: 0.4; padding: 8px 4px; }

        .page-content { flex: 1; overflow-y: auto; padding: 28px 32px; }
        .page-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
        .page-subtitle { color: #666; font-size: 14px; margin-bottom: 18px; }
        .version-pill { display: inline-block; padding: 5px 10px; background: #E8F5E9; color: #2C5E31; border-radius: 999px; font-size: 12px; font-weight: 700; margin-bottom: 16px; }

        .resource-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
        .resource-card { background: #FFF; border: 1px solid #E8E8E8; border-radius: 14px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: pointer; transition: box-shadow 0.2s; }
        .resource-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        .resource-category { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: #2C5E31; font-weight: 700; margin-bottom: 8px; }
        .resource-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
        .resource-summary { font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 12px; }
        .resource-actions { display: flex; gap: 8px; }
        .btn { padding: 8px 12px; border: none; border-radius: 9px; cursor: pointer; font-size: 12px; font-weight: 600; font-family: inherit; }
        .btn-primary { background: #2C5E31; color: #FFF; }
        .btn-secondary { background: #F0F0F0; color: #28282B; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(15,15,15,0.5); z-index: 1000; }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: #FFF; border-radius: 14px; padding: 20px; width: 90%; max-width: 900px; max-height: 80vh; overflow-y: auto; }
        .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
        .modal-body { font-size: 14px; color: #333; line-height: 1.6; white-space: pre-wrap; }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: 0; top: 69px; bottom: 0; z-index: 500; transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            .sidebar-toggle { display: block; }
            .header-name { display: none; }
            .page-content { padding: 20px 16px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </button>
            <img src="/static/menti logo.png" alt="Menti" class="header-logo">
            <h1>Menti</h1>
        </div>
        <div class="header-right">
            <button class="incognito-topbar-btn" id="incognitoTopBtn">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                Private
            </button>
            <div class="profile-menu-wrap" id="profileMenuWrap">
                <button class="profile-menu-trigger" id="profileMenuTrigger">
                    <div class="header-avatar" id="headerAvatar"><span>?</span></div>
                    <span class="header-name" id="headerName">Loading...</span>
                </button>
                <div class="profile-dropdown">
                    <a class="profile-dropdown-item" id="progressNavLink" href="#">My Progress</a>
                    <a class="profile-dropdown-item" id="planNavLink" href="#">Personalized Plan</a>
                    <a class="profile-dropdown-item" id="journalNavLink" href="#">My Journal</a>
                    <a class="profile-dropdown-item active-page" href="/offline-resources">Offline Resources</a>
                    <a class="profile-dropdown-item" href="/profile">Profile Settings</a>
                    <div class="profile-dropdown-divider"></div>
                    <button class="profile-dropdown-item profile-dropdown-logout" id="logoutBtn">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <div id="logoutModal" class="modal">
        <div class="modal-content">
            <h3>Confirm Logout</h3>
            <p>Are you sure you want to logout?</p>
            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
                <button class="btn btn-secondary" id="cancelLogoutBtn">Cancel</button>
                <button class="btn btn-primary" id="confirmLogoutBtn">Logout</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="window.location.href='/chat-page'">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                    </svg>
                    New Chat
                </button>
                <button class="toggle-archived-btn" id="toggleArchivedBtn" type="button" onclick="toggleArchivedView()">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.02 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.48-.17-.93-.46-1.27zM12 17.5L6.5 12H10v-2h4v2h3.5L12 17.5zM5.12 5l.81-1h12l.94 1H5.12z"/>
                    </svg>
                    <span id="toggleArchivedText">Show Archived</span>
                </button>
            </div>
            <div class="sidebar-content">
                <div class="sidebar-section-title" id="chatsTitle">Active Chats</div>
                <div id="convList"><div class="empty-state">Loading...</div></div>
            </div>
        </div>

        <div class="page-content">
            <div class="page-title">Offline Mental Health Resource Library</div>
            <div class="page-subtitle">Student-friendly tools you can access in-app even during unstable internet.</div>
            <div id="resourceVersion" class="version-pill">Version: --</div>
            <div class="resource-grid" id="resourceGrid"></div>
        </div>
    </div>

    <div id="resourceModal" class="modal">
        <div class="modal-content">
            <div class="modal-title" id="resourceModalTitle">Resource</div>
            <img id="resourceModalImage" src="" alt="Resource" style="width:100%;max-width:500px;height:auto;border-radius:12px;margin:16px 0;display:none;">
            <div class="modal-body" id="resourceModalBody"></div>
            <div style="display:flex;justify-content:flex-end;margin-top:12px;">
                <button class="btn btn-secondary" id="closeResourceModalBtn">Close</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBCYdU_-ZJjws8JTdmLiCgwkYD6O4ze9z0",
            authDomain: "menti-7b8a1.firebaseapp.com",
            projectId: "menti-7b8a1",
            storageBucket: "menti-7b8a1.firebasestorage.app",
            messagingSenderId: "164612023817",
            appId: "1:164612023817:web:c0437146e86951377f3ad8"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const profileMenuWrap = document.getElementById('profileMenuWrap');
        const CACHE_NS = 'menti_cache_v1';
        let currentUser = null;
        let currentResources = [];
        let showingArchived = sessionStorage.getItem('menti_sidebar_show_archived') === '1';

        function cacheKey(type, uid) { return `${CACHE_NS}:${type}:${uid}`; }
        function readCache(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (_) { return null; } }
        function writeCache(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (_) {} }
        function readSessionCache(key) { try { return JSON.parse(sessionStorage.getItem(key) || 'null'); } catch (_) { return null; } }
        function writeSessionCache(key, value) { try { sessionStorage.setItem(key, JSON.stringify(value)); } catch (_) {} }
        function escHtml(s) { return String(s || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }

        function updateHeaderProfile(user) {
            const name = user.displayName || user.email || 'User';
            document.getElementById('headerName').textContent = name;
            const avatarEl = document.getElementById('headerAvatar');
            if (user.photoURL) avatarEl.innerHTML = `<img src="${escHtml(user.photoURL)}" alt="Avatar">`;
            else {
                const initials = name.split(' ').filter(Boolean).map(w => w[0]).join('').toUpperCase().slice(0, 2) || '?';
                avatarEl.innerHTML = `<span>${initials}</span>`;
            }
            document.getElementById('progressNavLink').href = `/progress/${user.uid}`;
            document.getElementById('planNavLink').href = `/personalized-plan/${user.uid}`;
            document.getElementById('journalNavLink').href = `/journal/${user.uid}`;
            profileMenuWrap.style.display = 'flex';
            document.getElementById('incognitoTopBtn').style.display = 'flex';
        }

        async function loadSidebarConversations(uid) {
            const scope = showingArchived ? 'archived' : 'active';
            const key = cacheKey('conversations', `${uid}:${scope}`);
            const cached = readCache(key);
            const sessionKey = `menti_sidebar_cache:${uid}:${scope}`;
            const sessionCached = readSessionCache(sessionKey);

            if (sessionCached?.data && Array.isArray(sessionCached.data)) {
                renderConversations(sessionCached.data);
                if ((Date.now() - (sessionCached.ts || 0)) < 60000) return;
            }

            if (cached?.data) renderConversations(cached.data);
            try {
                const res = await fetch(`/conversations?user_id=${encodeURIComponent(uid)}&is_guest=false&is_archived=${showingArchived}`);
                if (!res.ok) throw new Error('Failed to fetch conversations');
                const conversations = await res.json();
                renderConversations(conversations || []);
                writeCache(key, { data: conversations || [] });
                writeSessionCache(sessionKey, { ts: Date.now(), data: conversations || [] });
            } catch (e) {
                if (!cached?.data) document.getElementById('convList').innerHTML = '<div class="empty-state">Could not load chats</div>';
            }
        }

        function applySidebarViewState() {
            const toggleBtn = document.getElementById('toggleArchivedBtn');
            const toggleText = document.getElementById('toggleArchivedText');
            const chatsTitle = document.getElementById('chatsTitle');
            if (!toggleBtn || !toggleText || !chatsTitle) return;
            if (showingArchived) {
                toggleBtn.classList.add('active');
                toggleText.textContent = 'Show Active';
                chatsTitle.textContent = 'Archived Chats';
            } else {
                toggleBtn.classList.remove('active');
                toggleText.textContent = 'Show Archived';
                chatsTitle.textContent = 'Active Chats';
            }
        }

        window.toggleArchivedView = function() {
            showingArchived = !showingArchived;
            sessionStorage.setItem('menti_sidebar_show_archived', showingArchived ? '1' : '0');
            applySidebarViewState();
            if (currentUser) loadSidebarConversations(currentUser.uid);
        };

        function renderConversations(conversations) {
            const listEl = document.getElementById('convList');
            if (!Array.isArray(conversations) || conversations.length === 0) {
                listEl.innerHTML = '<div class="empty-state">No conversations yet</div>';
                return;
            }
            listEl.innerHTML = conversations.map((d) => `<div class="conv-item" title="${escHtml(d.title || 'Untitled')}" onclick="window.location.href='/chat-page'">${escHtml(d.title || 'Untitled')}</div>`).join('');
        }

        function renderResources(data) {
            currentResources = data.items || [];
            document.getElementById('resourceVersion').textContent = `Version: ${data.version || '--'}`;
            const grid = document.getElementById('resourceGrid');
            grid.innerHTML = currentResources.map((item, idx) => `
                <div class="resource-card" onclick="window.openResource(${idx})">
                    <div class="resource-category">${escHtml(item.category || 'Resource')}</div>
                    <div class="resource-title">${escHtml(item.title || 'Untitled')}</div>
                    <div class="resource-summary">${escHtml(item.summary || '')}</div>
                    <div class="resource-actions">
                        <button class="btn btn-primary" onclick="event.stopPropagation(); window.openResource(${idx})">Open</button>
                        <button class="btn btn-secondary" onclick="event.stopPropagation(); window.downloadResource(${idx})">Download</button>
                    </div>
                </div>
            `).join('');
        }

        async function loadResources(uid) {
            const key = cacheKey('offline-resources', uid);
            const cached = readCache(key);
            if (cached?.data) renderResources(cached.data);
            try {
                const res = await fetch('/offline-resources/data');
                if (!res.ok) throw new Error('Failed to load resources');
                const data = await res.json();
                if (!cached?.data || cached?.data?.version !== data.version) {
                    writeCache(key, { data });
                }
                renderResources(data);
            } catch (e) {
                if (!cached?.data) {
                    document.getElementById('resourceGrid').innerHTML = '<div class="empty-state">Could not load resources right now.</div>';
                }
                console.error('Resource load error:', e);
            }
        }

        window.openResource = function(idx) {
            const item = currentResources[idx];
            if (!item) return;
            document.getElementById('resourceModalTitle').textContent = item.title || 'Resource';
            document.getElementById('resourceModalBody').textContent = item.content || item.summary || '';
            const imgEl = document.getElementById('resourceModalImage');
            if (item.image) {
                imgEl.src = item.image;
                imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none';
            }
            document.getElementById('resourceModal').classList.add('show');
        };

        window.downloadResource = function(idx) {
            const item = currentResources[idx];
            if (!item) return;
            const lines = [item.title || 'Resource', '', item.summary || '', '', item.content || ''];
            const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${(item.title || 'resource').toLowerCase().replace(/[^a-z0-9]+/g, '_')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        };

        document.getElementById('profileMenuTrigger').addEventListener('click', (e) => {
            e.stopPropagation();
            profileMenuWrap.classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            if (!profileMenuWrap.contains(e.target)) profileMenuWrap.classList.remove('open');
            if (window.innerWidth <= 768 && sidebar.classList.contains('show')) {
                const clickedInsideSidebar = sidebar.contains(e.target);
                const clickedToggle = sidebarToggle.contains(e.target);
                if (!clickedInsideSidebar && !clickedToggle) sidebar.classList.remove('show');
            }
        });
        sidebarToggle.addEventListener('click', () => {
            if (window.innerWidth <= 768) sidebar.classList.toggle('show');
            else sidebar.classList.toggle('hidden');
        });

        document.getElementById('incognitoTopBtn').addEventListener('click', () => { window.location.href = '/incognito'; });
        document.getElementById('closeResourceModalBtn').addEventListener('click', () => document.getElementById('resourceModal').classList.remove('show'));
        document.getElementById('resourceModal').addEventListener('click', (e) => { if (e.target.id === 'resourceModal') e.currentTarget.classList.remove('show'); });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            document.getElementById('logoutModal').classList.add('show');
            profileMenuWrap.classList.remove('open');
        });
        document.getElementById('cancelLogoutBtn').addEventListener('click', () => document.getElementById('logoutModal').classList.remove('show'));
        document.getElementById('confirmLogoutBtn').addEventListener('click', async () => {
            document.getElementById('logoutModal').classList.remove('show');
            try { await fetch('/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: currentUser?.uid, is_guest: false }) }); } catch (_) {}
            await signOut(auth);
            window.location.href = '/';
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = '/'; return; }
            if (user.isAnonymous) { window.location.href = '/chat-page'; return; }
            currentUser = user;
            updateHeaderProfile(user);
            applySidebarViewState();
            await loadSidebarConversations(user.uid);
            await loadResources(user.uid);
        });
    </script>
</body>
</html>
