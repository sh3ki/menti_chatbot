<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menti - Provider Signup</title><style>body{font-family:Inter,Arial,sans-serif;background:#eef4ef;min-height:100vh;display:grid;place-items:center;color:#17221a}.card{background:#fff;width:min(520px,calc(100% - 32px));padding:34px;border-radius:18px;box-shadow:0 12px 35px #234a2720}h1{color:#2c5e31;margin:0 0 6px}p{color:#68746b;margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #d4ded5;border-radius:9px;box-sizing:border-box;font-size:14px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#2c5e31;color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:9px}.google{background:#fff;color:#222;border:1px solid #cdd8ce}.msg{padding:11px;border-radius:9px;background:#fff0f0;color:#b42318;display:none;margin:14px 0;font-size:13px}.hint{font-size:12px;color:#68746b;margin-top:14px}.links{text-align:center;margin-top:18px;font-size:13px}.links a{color:#2c5e31;font-weight:700}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><main class="card"><h1>Provider application</h1><p>Apply as a Menti psychiatrist or psychologist.</p><div id="msg" class="msg"></div><form id="form"><div class="grid"><div class="field"><label>First name *</label><input id="firstName" required></div><div class="field"><label>Middle name</label><input id="middleName"></div></div><div class="grid"><div class="field"><label>Last name *</label><input id="lastName" required></div><div class="field"><label>Role *</label><select id="role" required><option value="">Select role</option><option value="psychiatrist">Psychiatrist</option><option value="psychologist">Psychologist</option></select></div></div><div class="field"><label>Professional license number *</label><input id="licenseNumber" required></div><div class="field"><label>Email *</label><input id="email" type="email" required></div><div class="field"><label>Password *</label><input id="password" type="password" minlength="8" required></div><button>Create provider application</button></form><button class="google" id="google">Continue with Google</button><div class="hint">Google signup will use your Google name and email, then submit the other application details above.</div><div class="links">Already applied? <a href="/providers/login">Provider login</a></div></main>
<script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';import{getAuth,createUserWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,updateProfile}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';const app=initializeApp({apiKey:'AIzaSyBCYdU_-ZJjws8JTdmLiCgwkYD6O4ze9z0',authDomain:'menti-7b8a1.firebaseapp.com',projectId:'menti-7b8a1',storageBucket:'menti-7b8a1.firebasestorage.app',messagingSenderId:'164612023817',appId:'1:164612023817:web:c0437146e86951377f3ad8'});const auth=getAuth(app),msg=document.getElementById('msg');function error(e){msg.textContent=e;msg.style.display='block'}async function register(){if(!role.value||!firstName.value.trim()||!lastName.value.trim()||!licenseNumber.value.trim())throw Error('Complete all required provider fields');const token=await auth.currentUser.getIdToken();const r=await fetch('/providers/register',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({firstName:firstName.value,middleName:middleName.value,lastName:lastName.value,role:role.value,licenseNumber:licenseNumber.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Application failed');location.href=d.redirect}form.onsubmit=async e=>{e.preventDefault();try{const c=await createUserWithEmailAndPassword(auth,email.value,password.value);await updateProfile(c.user,{displayName:(firstName.value+' '+lastName.value).trim()});await register()}catch(e){error(e.message)}};google.onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider());email.value=auth.currentUser.email||'';if(!firstName.value)firstName.value=(auth.currentUser.displayName||'').split(' ')[0]||'';if(!lastName.value)lastName.value=(auth.currentUser.displayName||'').split(' ').slice(1).join(' ');await register()}catch(e){error(e.message)}}</script></body></html>
<script>const g=document.querySelector('.google');if(g){g.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Continue with Google';}</script>
<script>document.querySelector('.google')?.remove();document.querySelector('.hint')?.remove();</script>
