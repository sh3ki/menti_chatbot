<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Menti - Provider Signup</title>
    <style>
        body{font-family:Inter,Arial,sans-serif;background:#eef4ef;min-height:100vh;display:grid;place-items:center;color:#17221a}
        .card{background:#fff;width:min(520px,calc(100% - 32px));padding:34px;border-radius:18px;box-shadow:0 12px 35px #234a2720}
        h1{color:#2c5e31;margin:0 0 6px}p{color:#68746b;margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
        .field input,.field select{width:100%;padding:12px;border:1px solid #d4ded5;border-radius:9px;box-sizing:border-box;font-size:14px}
        button{width:100%;padding:13px;border:0;border-radius:10px;background:#2c5e31;color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:9px}
        .msg{padding:11px;border-radius:9px;background:#fff0f0;color:#b42318;display:none;margin:14px 0;font-size:13px}
        .hint{font-size:12px;color:#68746b;margin-top:14px}.links{text-align:center;margin-top:18px;font-size:13px}.links a{color:#2c5e31;font-weight:700}
        @media(max-width:500px){.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <main class="card">
        <h1>Provider application</h1>
        <p>Apply as a Menti psychiatrist or psychologist.</p>
        <div id="msg" class="msg"></div>
        <form id="form">
            <div class="grid"><div class="field"><label>First name *</label><input id="firstName" required></div><div class="field"><label>Middle name</label><input id="middleName"></div></div>
            <div class="grid"><div class="field"><label>Last name *</label><input id="lastName" required></div><div class="field"><label>Role *</label><select id="role" required><option value="">Select role</option><option value="psychiatrist">Psychiatrist</option><option value="psychologist">Psychologist</option></select></div></div>
            <div class="field"><label>Professional license number *</label><input id="licenseNumber" required></div>
            <div class="field"><label>Email *</label><input id="email" type="email" required></div>
            <div class="field"><label>Password *</label><input id="password" type="password" minlength="8" required></div>
            <button type="submit">Create provider application</button>
        </form>
        <div class="hint">Use your provider email and password to create your account and submit your application.</div>
        <div class="links">Already applied? <a href="/providers/login">Provider login</a></div>
    </main>
    <script type="module">
        import { initializeApp, getAuth, createUserWithEmailAndPassword, updateProfile } from '/static/js/auth-client.js';
        const app = initializeApp({});
        const auth = getAuth(app), msg = document.getElementById('msg');
        function showError(error) { msg.textContent = error; msg.style.display = 'block'; }
        form.onsubmit = async event => {
            event.preventDefault();
            try {
                if (!role.value || !firstName.value.trim() || !lastName.value.trim() || !licenseNumber.value.trim()) throw Error('Complete all required provider fields');
                const account = await createUserWithEmailAndPassword(auth, email.value, password.value);
                await updateProfile(account.user, { displayName: `${firstName.value} ${lastName.value}`.trim() });
                const response = await fetch('/providers/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ firstName:firstName.value, middleName:middleName.value, lastName:lastName.value, role:role.value, licenseNumber:licenseNumber.value }) });
                const result = await response.json();
                if (!response.ok) throw Error(result.error || 'Application failed');
                location.href = result.redirect;
            } catch (error) { showError(error.message); }
        };
    </script>
</body>
</html>
